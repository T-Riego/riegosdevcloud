name: Deploy Automático na VPS

# Define que o robô só vai rodar quando você atualizar a branch 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectando na VPS e Atualizando o Site
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Estes são exatamente os comandos que você rodava na mão!
          script: |
            cd /opt/riegosdev-site
            git pull
            docker build -t riegosdev-site:latest .
            docker service update --image riegosdev-site:latest --force site-oficial_web